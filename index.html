<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À La Tienne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>À La Tienne</h1>
        </header>

        <div class="photo-container">
            <img id="photoDisplay" src="" alt="Photo" class="photo">
        </div>

        <form id="trinqueForm" class="form">
            <div class="form-group">
                <label for="player">Qui trinque</label>
                <select id="player" required>
                    <option value="">Sélectionne</option>
                    <option value="sisiboubou">Sisiboubou</option>
                    <option value="alalboubou">Alalboubou</option>
                    <option value="autre">Autre</option>
                </select>
            </div>

            <div class="form-group">
                <label for="trinquade">À quoi</label>
                <input
                    type="text"
                    id="trinquade"
                    placeholder="Les sardines, la bière, etc."
                    required
                >
            </div>

            <button type="submit" class="btn">Trinquer</button>
        </form>

        <div id="response" class="response hidden">
            <div id="responseContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
